<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc"><title id="title">Sincronización local y remota de Outplay</title><desc id="desc">Partidas: leer caché, consultar remoto, guardar o conservar. Perfil: guardar pendiente, enviar, confirmar o reintentar.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#587168"/></marker></defs><rect width="1280" height="1050" fill="#f5f4ec"/><g font-family="Arial, sans-serif"><text x="60" y="60" font-size="15" fill="#617334" font-weight="bold">OUTPLAY · UNIDADES I Y II</text><text x="60" y="105" font-size="34" fill="#162b23" font-weight="bold">Persistencia y sincronización</text><text x="60" y="140" font-size="17" fill="#53635b">Los datos locales permanecen disponibles mientras se recupera la conexión.</text><text x="305" y="200" text-anchor="middle" font-size="19" fill="#162b23">PARTIDAS · REMOTO → LOCAL</text><rect x="60" y="230" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="305.0" y="260" text-anchor="middle" font-size="16" fill="#162b23">Elegir filtros y leer copia local</text><text x="305.0" y="283" text-anchor="middle" font-size="16" fill="#162b23">Mostrar datos guardados si existen</text><path d="M305,306 L305,341" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="350" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="305.0" y="380" text-anchor="middle" font-size="16" fill="#162b23">Esperar conexión</text><text x="305.0" y="403" text-anchor="middle" font-size="16" fill="#162b23">Offline: conservar la vista local</text><path d="M305,426 L305,461" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="470" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="305.0" y="500" text-anchor="middle" font-size="16" fill="#162b23">Consultar API PHP / Lichess</text><text x="305.0" y="523" text-anchor="middle" font-size="16" fill="#162b23">Reconexión, selección o reintento</text><path d="M305,546 L305,572 L175,572 L175,610" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M305,572 L435,572 L435,610" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="175" y="598" text-anchor="middle" font-size="14" fill="#162b23">Éxito</text><text x="435" y="598" text-anchor="middle" font-size="14" fill="#162b23">Error</text><rect x="60" y="620" width="230" height="76" rx="12" fill="#e6efcf" stroke="#b6c3b6"/><text x="175.0" y="650" text-anchor="middle" font-size="16" fill="#162b23">Guardar partidas</text><text x="175.0" y="673" text-anchor="middle" font-size="16" fill="#162b23">y fecha de descarga</text><rect x="320" y="620" width="230" height="76" rx="12" fill="#fff0d4" stroke="#b6c3b6"/><text x="435.0" y="650" text-anchor="middle" font-size="16" fill="#162b23">Conservar copia local</text><text x="435.0" y="673" text-anchor="middle" font-size="16" fill="#162b23">Mostrar error</text><rect x="320" y="760" width="230" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="435.0" y="790" text-anchor="middle" font-size="16" fill="#162b23">Reintentar cada 30 s</text><text x="435.0" y="813" text-anchor="middle" font-size="16" fill="#162b23">o manualmente</text><path d="M435,696 L435,751" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M550,798 L575,798 L575,388 L550,388" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="955" y="200" text-anchor="middle" font-size="19" fill="#162b23">PERFIL · LOCAL → REMOTO</text><rect x="710" y="230" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="955.0" y="260" text-anchor="middle" font-size="16" fill="#162b23">Editar nombre y correo</text><text x="955.0" y="283" text-anchor="middle" font-size="16" fill="#162b23">Guardar pendiente por usuario</text><path d="M955,306 L955,341" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="710" y="350" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="955.0" y="380" text-anchor="middle" font-size="16" fill="#162b23">Esperar conexión y sesión</text><text x="955.0" y="403" text-anchor="middle" font-size="16" fill="#162b23">Offline: mostrar pendiente local</text><path d="M955,426 L955,461" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="710" y="470" width="490" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="955.0" y="500" text-anchor="middle" font-size="16" fill="#162b23">Enviar PUT de perfil</text><text x="955.0" y="523" text-anchor="middle" font-size="16" fill="#162b23">Una sincronización a la vez</text><path d="M955,546 L955,572 L825,572 L825,610" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M955,572 L1085,572 L1085,610" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="825" y="598" text-anchor="middle" font-size="14" fill="#162b23">Éxito</text><text x="1085" y="598" text-anchor="middle" font-size="14" fill="#162b23">Error</text><rect x="710" y="620" width="230" height="76" rx="12" fill="#e6efcf" stroke="#b6c3b6"/><text x="825.0" y="650" text-anchor="middle" font-size="16" fill="#162b23">Guardar confirmación</text><text x="825.0" y="673" text-anchor="middle" font-size="16" fill="#162b23">Eliminar pendiente</text><rect x="970" y="620" width="230" height="76" rx="12" fill="#fff0d4" stroke="#b6c3b6"/><text x="1085.0" y="650" text-anchor="middle" font-size="16" fill="#162b23">Conservar pendiente</text><text x="1085.0" y="673" text-anchor="middle" font-size="16" fill="#162b23">Mostrar error</text><rect x="970" y="760" width="230" height="76" rx="12" fill="#fff" stroke="#b6c3b6"/><text x="1085.0" y="790" text-anchor="middle" font-size="16" fill="#162b23">Temporal: reintentar</text><text x="1085.0" y="813" text-anchor="middle" font-size="16" fill="#162b23">Conflicto: corregir</text><path d="M1085,696 L1085,751" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1200,798 L1225,798 L1225,388 L1200,388" stroke="#587168" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="890" width="1140" height="110" rx="12" fill="#172a22"/><text x="85" y="920" dy="0" font-size="16" fill="#edf4dc">Reintentos automáticos con la app abierta. Los errores de validación requieren corrección o reintento manual.</text><text x="85" y="920" dy="28" font-size="16" fill="#edf4dc">Contraseñas: solo en línea y sin pendientes. Nunca se almacenan en la bandeja de sincronización.</text><text x="85" y="920" dy="56" font-size="16" fill="#edf4dc">Online indica conectividad del dispositivo; los fallos del servidor se manejan por separado.</text></g></svg>